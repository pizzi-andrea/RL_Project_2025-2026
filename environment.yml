name: RL_PRJ
channels:
  - pytorch
  - defaults
  - conda-forge
dependencies: # conda dependences
  - python=3.12
  - pip
  - opencv
  - pip: # packages
      # fixed version libs
      - torch
      # free version libs
      - tensorboard
      - numpy
      - vizdoom
      - pandas
      - pandas[performance]
      - matplotlib
      - seaborn
      - torchmetrics
      - torchvision
      - lightning
      - tqdm
      - timm
      - rich
