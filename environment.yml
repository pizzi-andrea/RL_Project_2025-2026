name: RL_PRJ
channels:
  - pytorch
  - defaults
  - conda-forge
dependencies: # conda dependences
  - python=3.12
  - pip
  - pip: # packages 
    
    # fixed version libs
    - torch==2.9.1
    # free version libs
    - numpy
    - vizdoom
    - pandas
    - pandas[performance]
    - matplotlib
    - seaborn
    - torchmetrics
    - torchvision
    - lightning
    - tqdm
    - opencv-python


    
