PER_config:
  buffer_size: 100000 # 100.000 almeno
  cache: ".per/"
  
  
  
global_config:
  multi_cpu: 24
  max_episode_length: 1200
  warmup: 0
  Project_logs: "Project"
  action_shape: 17
  att_shape: 7
  sample_episods: 1000
  img_channels: 3
  img_size_h : 120
  img_size_l : 160
  dreamer_iterations: 100
  # vae_w: "weights/vae/vae.ckpt"
  dreamer_w: "weights/rssm/rssm.ckpt"
  policy_w : "weights/policy/policy.ckpt"
  chunk: 64

  envs:

    - "VizdoomDeadlyCorridor-v1"
    - "VizdoomBasicNotifications-v1"
    - "VizdoomDefendLine-v1"

  envs_episods:
    - 500
    - 100
    - 500
   
vae_config:
  latent_dim: 768
  model_dim: 768
  # VAE_dataset_path_train: "Doom4VAE/train" #funny/train
  # VAE_dataset_path_valid: "Doom4VAE/validation" #funny/valid
  # train_epoch: 0 #25
  # train_batch: 64
  


rssm_config:
  rssm_dataset_path_train: "Doom4RSSMs/train" #funny/train
  train_steps: 1000 #100
  train_batch: 8 # train batch
  burn_in: 10
  free_nats: 1.0
  min_buckets: -20
  max_buckets: 20
  batch_acc: 8
  a_att: 1
  a_obs: 0.01
  a_cont: 10
  a_rew: 1
  
  detterministic_latent_dim: 4012
  rssm_latent_dim: 768 # b
  common_latent_dim: 768
  stochastic_latent: 64
  stochastic_classes: 64
  batch_acc: 8
  buckets: 255
  unimix: 0.01
  beta_dyn: 1.0
  beta_pred: 1.0
  beta_rep: 0.1
  lr: 0.00008


policy_config:
  train_steps: 1000
  buckets: 255
  horizont: 30
  burn_in: 10
  lr: 0.00008
  actor_entropy: 0.005
  train_batch: 32
  batch_acc: 1
  hidden_dim: 768
  unimix: 0.03
  ema_decay: 0.99
  ema_epsilon: 1.0
  min_buckets: -20
  max_buckets: 20


