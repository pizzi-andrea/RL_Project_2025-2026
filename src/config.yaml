PER_config:
  buffer_size: 1000000 # 100.000 almeno
  cache: ".per/"
  
  
global_config:
  multi_cpu: 24
  max_episode_length: 2100
  warmup: 3
  Project_logs: "Project"
  action_shape: 16
  att_shape: 7
  img_channels: 3
  img_size_h : 120
  img_size_l : 160
  dreamer_iterations: 100
  vae_w: "weights/vae.ckpt"
  dreamer_w: "weights/rssm.ckpt"
  policy_w : "weights/policy.ckpt"
  chunk: 64

  envs:

    - "VizdoomCorridor-v0"
    - "VizdoomBasic-v0"

  envs_episods:
    - 100
    - 50
   
vae_config:
  VAE_dataset_path_train: "Doom4VAE/train" #funny/train
  VAE_dataset_path_valid: "Doom4VAE/validation" #funny/valid
  train_epoch: 45 #25
  train_batch: 64
  latent_dim: 1024


rssm_config:
  rssm_dataset_path_train: "Doom4RSSMs/train" #funny/train
  rssm_dataset_path_valid: "Doom4RSSMs/validation" #funny/train
  train_epoch: 5
  train_batch: 16
  free_nats: 0.01
  unimix: 0.01
  beta_dyn: 0.5
  beta_pred: 1.0
  beta_rep: 0.1
  lr: 0.0001


policy_config:
  policy_dataset_path_train: "Doom4RSSMs/validation" #funny/train
  train_epoch: 5
  horizont: 20
  burn_in: 3
  train_batch: 32
  lr: 0.00004
  actor_entropy: 0.00003


