PER_config:
  buffer_size: 1000000
  cache: ".per/"

global_config:
  multi_cpu: 24
  max_episode_length: 300
  warmup: 16
  Project_logs: "dreamerv0.4"
  action_shape: 24
  att_shape: 7
  skip_frame: 4
  img_channels: 3
  img_size_h : 64
  img_size_l : 64
  dreamer_iterations: 64
  dreamer_w: "weights/rssm/rssm.ckpt"
  policy_w : "weights/policy/policy.ckpt"
  chunk: 64
  precision: "32-true" # bf16-mixed
  position_gain: 0.01
  compile: false

  envs:
    - "VizdoomBasic-v1" # VizdoomBasic-v1 VizdoomHealthGathering-v1

  envs_episodes:
    -  10

encoder_config:
  latent_dim: 384
  model_dim: 384

curiosity_config:
  alpha: 0.3
  beta: 0.1
  eps: 0.000001
  p_max: 1
  c: 0.1

rssm_config:
  sample_episodes: 128
  rssm_dataset_path_train: "Doom4RSSMs/train"
  train_steps: 320  
  train_batch: 32
  burn_in: 15
  free_nats: 1.0

  min_buckets: -20
  max_buckets: 20

  a_att: 1.0
  a_obs: 1.0
  a_cont: 1.0
  a_rew: 1.0

  detterministic_latent_dim: 3072 
  rssm_latent_dim: 384 
  common_latent_dim: 384
  stochastic_latent: 24
  stochastic_classes: 24
  batch_acc: 1
  buckets: 255
  unimix: 0.01
  
  beta_dyn: 1.0
  beta_pred: 1.0
  beta_rep: 0.1
  lr:  0.00004  # 0.00004 

policy_config:
  sample_episodes: 128
  train_steps: 256
  buckets: 255
  horizon: 12
  burn_in: 15
  lr: 0.00004 # 0.00004
  actor_entropy: 0.00005  # aumentata da 0.00005
  train_batch:  32
  batch_acc: 1
  hidden_dim: 128
  unimix: 0.01
  ema_decay: 0.99
  ema_epsilon: 1.0
  min_buckets: -20
  max_buckets:  20
