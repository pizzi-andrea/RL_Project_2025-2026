PER_config:
  buffer_size: 1000000
  cache: ".per/"

global_config:
  multi_cpu: 24
  max_episode_length: 500
  warmup: 50
  Project_logs: "Project"
  action_shape: 24
  att_shape: 7
  skip_frame: 2
  img_channels: 3
  img_size_h : 64
  img_size_l : 64
  dreamer_iterations: 100
  dreamer_w: "weights/rssm/rssm.ckpt"
  policy_w : "weights/policy/policy.ckpt"
  chunk: 64
  precision: "32-true" # bf16-mixed

  envs:
    - "VizdoomBasic-v1"

  envs_episodes:
    -  100

vae_config:
  latent_dim: 1024
  model_dim: 64

curiosity_config:
  alpha: 0.8
  beta: 0.1
  eps: 0.003
  p_max: 10
  c: 0.1

rssm_config:
  sample_episodes: 100
  rssm_dataset_path_train: "Doom4RSSMs/train"
  train_steps: 500
  train_batch: 16 
  burn_in: 15
  free_nats: 1.0

  min_buckets: -20
  max_buckets: 20

  a_att: 1.0
  a_obs: 1.0
  a_cont: 1.0
  a_rew: 1.0

  detterministic_latent_dim: 1024 
  rssm_latent_dim: 512 
  common_latent_dim: 1024
  stochastic_latent: 64
  stochastic_classes: 64
  batch_acc: 1
  buckets: 255
  unimix: 0.01
  beta_dyn: 1.0
  beta_pred: 1.0
  beta_rep: 0.1
  lr: 0.0005
policy_config:
  sample_episodes: 200
  train_steps: 500
  buckets: 255
  horizon: 15
  burn_in: 15
  lr: 0.0005
  actor_entropy: 0.001  # aumentata da 0.00005
  train_batch: 16
  batch_acc: 1
  hidden_dim: 256
  unimix: 0.01
  ema_decay: 0.99
  ema_epsilon: 1.0
  min_buckets: -20
  max_buckets:  20
