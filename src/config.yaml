PER_config:
  buffer_size: 1000000 # 100.000 almeno
  cache: ".per/"
  
  
global_config:
  multi_cpu: 24
  max_episode_length: 2100
  warmup: 0
  Project_logs: "Project"
  action_shape: 17
  att_shape: 7
  img_channels: 3
  img_size_h : 120
  img_size_l : 160
  dreamer_iterations: 100
  vae_w: "weights/vae/vae.ckpt"
  dreamer_w: "weights/rssm/rssm.ckpt"
  policy_w : "weights/policy/policy.ckpt"
  chunk: 74

  envs:

    - "VizdoomCorridor-v0"
    - "VizdoomBasic-v0"

  envs_episods:
    - 50
    - 50
   
vae_config:
  VAE_dataset_path_train: "Doom4VAE/train" #funny/train
  VAE_dataset_path_valid: "Doom4VAE/validation" #funny/valid
  train_epoch: 0 #25
  train_batch: 64
  latent_dim: 769
  model_dim: 768


rssm_config:
  rssm_dataset_path_train: "Doom4RSSMs/train" #funny/train
  rssm_dataset_path_valid: "Doom4RSSMs/validation" #funny/train
  train_epoch: 0
  train_batch: 8
  burn_in: 10
  free_nats: 1.0
  
  detterministic_latent_dim: 6144
  rssm_latent_dim: 768
  common_latent_dim: 768
  stochastic_latent: 48
  stochastic_classes: 48
  
  unimix: 0.01
  beta_dyn: 1.0
  beta_pred: 1.0
  beta_rep: 0.1
  lr: 0.00006


policy_config:
  policy_dataset_path_train: "Doom4RSSMs/validation" #funny/train
  train_epoch: 8
  buckets: 255
  horizont: 20
  burn_in: 10
  train_batch: 32
  lr: 0.00005
  actor_entropy: 0.0005
  hidden_dim: 768
  unimix: 0.01
  ema_decay: 0.98
  ema_epsilon: 0.00006


