PER_config:
  buffer_size: 1000000
  cache: ".per/"

global_config:
  multi_cpu: 24
  max_episode_length: 300
  warmup: 100            # Aumentato per raccogliere sufficienti transizioni iniziali
  Project_logs: "dreamerv1.0"
  action_shape: 24
  att_shape: 7
  skip_frame: 4
  img_channels: 3
  img_size_h : 64
  img_size_l : 64
  dreamer_iterations: 128
  dreamer_w: "weights/rssm/rssm.ckpt"
  policy_w : "weights/policy/policy.ckpt"
  chunk: 64
  precision: "bf16-mixed" #
  position_gain: 0.01
  compile: false

  envs:
    - "VizdoomBasic-v1"

  envs_episodes:
    - 10

encoder_config:
  latent_dim: 512
  model_dim: 512

curiosity_config:
  alpha: 0.5
  beta: 0.4
  eps: 0.000001
  p_max: 30
  c: 0.01

rssm_config:
  sample_episodes: 128
  rssm_dataset_path_train: "Doom4RSSMs/train"
  train_steps: 300
  train_batch: 16
  burn_in: 15
  free_nats: 1.0

  min_buckets: -20
  max_buckets: 20

  a_att: 1.0
  a_obs: 1.0
  a_cont: 1.0
  a_rew: 1.0

  detterministic_latent_dim: 512
  rssm_latent_dim: 512
  common_latent_dim: 512
  stochastic_latent: 32
  stochastic_classes: 32
  batch_acc: 1
  buckets: 255
  unimix: 0.01

  beta_dyn: 1.0
  beta_pred: 1.0
  beta_rep: 0.1
  lr: 0.0001
policy_config:
  sample_episodes: 128
  train_steps: 300
  buckets: 255
  horizon: 15
  burn_in: 15
  lr_actor: 0.00003
  lr_critic: 0.00003
  actor_entropy: 0.0003
  train_batch: 16
  batch_acc: 1
  hidden_dim: 512
  unimix: 0.01
  ema_decay: 0.98
  ema_epsilon: 1e-5
  min_buckets: -20
  max_buckets: 20
